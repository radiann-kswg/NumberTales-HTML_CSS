			<h3>夢からの目覚め</h3><p>
			「－－『裁判の結果、被告に３ヵ月の懲戒処分を科す』。その間、主従活動も この研究室から外界に出ることも禁止…」<br />
			窓越しに雨上がりの曇天の空が映る中、ある研究所のメンテナンス室で零(レイ)は顔を顰(しか)めて書類を眺めていた。端末と彼女の右手側には、球体型のフォルムに収納された一体のポータブルヒューマノイドが 端末に繋がれた状態で静かに眠っている。<br />
			「罪状は主人に対する暴行を試みた疑い。未然にその暴行を防げたとは言え、それは彼女が主人に対して攻撃的な発言を行ったからこそ……」<br />
			零は書類に描かれてあるヒューマノイドの法的裁判の結果を読み、左手で眉間を抑えては右手で端末を操作する仕草を繰り返したのち、椅子の背に凭(もた)れるようにして天を仰いだ。<br />
			「…いくら何でもヒューマノイドに関する法律が定まってないのが露見してる。人間は手を出すまで無罪なのに、彼女らはそれが予想された時点で有罪なんてさ。『第７の世界破壊：人権戦争の高度化』も収束しつつあるというのに……人間がヒューマノイドを信用してないのが、まるで目に見えてしまうよ」<br />
			<br />
			彼女らの居る九蓮国の昨今の司法は、技術の暴走リスクと人間社会への法的な導入が近年になって進行してきている。特に「ヒューマノイド原則法」はその一つだ。しかしながらヒューマノイドに関する厳重な規制が多く、それらは不完全なものだったのだ。今こうしてヒューマノイド事業に成功したのが、零ら率いる「百花繚乱研究所」と 国家技術機関である「夜月機関」のただ２機構のみである程には。<br />
			<br />
			「（ｺﾝｺﾝ）…零、93(クミ)のお見舞いに来たぞ」 <br />
			零が思考を巡らせていると、扉の向こう側から男性型ヒューマノイドの声が聞こえてくる。<br />
			「39(サク)、気に掛けてくれてありがとう。どうぞ」<br />
			零は扉の方向へ微笑み掛けるように呼び掛け、39(サク)をメンテナンス室に招き入れる。<br />
			「…ったく…、此奴はいつも一人で…」<br />
			球体型に包まったままメンテナンスを悲しげな眠り顔で受けているヒューマノイドを、兄個体である39(サク)は 気難しくも惜しむように見つめる。<br />
			「あまり干渉しないであげてね。まだ感情と人格の修復(リカヴァリ)が終わってないから」<br />
			零はそう静かに言って、メンテナンス中のヒューマノイドを優しく撫でる。<br />
			「9(チカ)から妙な噂聞きつけたと聞き流していたが……本当だったなら、此奴の助けに俺もなろうとしてたのによ」<br />
			39(サク)はそう何かを噛み締めるように呟くと、優しい笑みをしていた零の顔も また真剣な形相に締まる。先程の法的裁判と、今こうしてメンテナンスを受けている彼女に関することだろう。<br />
			「駄目だよ。君だって、つい先日は他人のこと言えなかったじゃないか。彼女ほどではとはいえ、君の一件も凄くすごーく手を焼いたからね。『39(サク)が主人の同級生に宣戦布告した！』とSNSで炎上したときは、君の記録(ログ)を手掛かりに異議を唱えようと私(あたし)も徹夜続きだったんだよ？」<br />
			「……だが…」<br />
			零にそう言い返され、再び39(サク)は気まずそうにしてしまう。<br />
			<br />
			「…まぁでも、39(サク)が色々思うことがあるのはわかるよ。ヒューマノイドの主従活動事業を普及させるには、まだまだこの社会もぶっちゃけ発展途上だし」<br />
			零は気を取り直し、再び笑みを戻しながら書類を置いてそう優しく語り掛ける。<br />
			「だから今は、クライアント君たちにとってナンバーテールズやヒューマノイドが信用できるようなことをしていこう？私はみんなを信じてるからさ」<br />
			窓の向こう側で少しずつ光が戻ってきている。<br />
			<br />
			「……そうだ。君のクライアント君、希(のぞみ)ちゃんは元気にしてる？志望校の受験まであと半年って聞いているけど」<br />
			零は少しを崩してから39(サク)に訊いた。<br />
			39「…相棒はお取込み中だ。昨日の模擬試験の結果が腑に落ちなかったのか、自室で必死になってる。見るからに合格は恐らく目と鼻の先との結果だった、あとは相棒次第だろう」<br />
			零「この前は成績も低かったなか頑張ってるんだね。応援しに行かなくても大丈夫？」<br />
			39「……別に。俺は相棒が突き進むべき道を拓いただけで、彼奴(あいつ)は自分の進むべき道さえあれば突き進む。俺との契約期間は残り１ヵ月も無いし、まぁ俺が干渉するほどでもないだろう」<br />
			39(サク)は気が紛れたのかドライな様子で、しかしながら少し自信気にそう答えた。<br />
			零「…あはは…一昨日まであれだけ血気盛んに対抗心を燃やしてたのに……まぁそれも39(サク)らしいから、私は否定しないけどね」<br />
			<br />
			「（ﾋﾟﾋﾟｯ）－－修復が完了しました」<br />
			メンテナンス中のヒューマノイドに繋いでいる端末から、電子音声と共にログが出力された。零はいよいよかと端末に出力されたログを一読する。<br />
			零「…おっ、全部正常に修復できてる！よかった～…これで彼女の暴走リスクはとりあえず解決かな」<br />
			39「…そうか」<br />
			39(サク)は零の言葉を聞き、静かに席を立って扉へ向かうように零たちへ背を向けた。<br />
			「93(クミ)のことを、よろしく頼む」<br />
			39(サク)は背中でそう言い残し、メンテナンス室を後にする。<br />
			その背中に零は「うん、任せて」と静かに応えた。<br />
			<br />
			「っくぅ～～……とはいえ火消しもこれで27件目かぁ…、まだ未然防止できてる百花研だからこそクライアント君たちに信用されてるだけあれど、今度こそ炎上しないといいな…」<br />
			零はストレスから解放されるように伸びをした。<br />
			「…これも『彼』が、暴走を未然に防いでくれた御蔭だね。独自にみんなを管制はしてるとはいえ すごく助かってるよ、ありがとう」<br />
			零はそう静かに言葉を零し、メンテナンスを終えたヒューマノイドの少女：「93(クミ)」と端末を繋いでいるケーブルを慎重かつ手短に外した。<br />
			「－－よしっ。もう起きていいよ、93(クミ)」<br />
			零はまん丸と籠るように鎮座している93(クミ)へ静かに呼びかけた。<br />
			93(クミ)は頭部フレームを恐る恐ると静かに動かし、眠りから目覚めるように瞳を開けた。<br />
			93「－－ん…ここは…？あたしは、いったい…」<br />
			零「大丈夫？具合はどう？」<br />
			93「…なんだか…ひどく申し訳ないことを、さっきまでしていたような…」<br />
			零「状況は飲めないときはゆっくりでいいよ。幸運にも…ではないけれど、今は休息が十分にできるからね」<br />
			零は、優しく93(クミ)の頭を撫でながら宥(なだ)めるように語り掛けた。<br />
			悪天候の後の静けさの様な温かさが、メンテナンス室を穏やかに包み込んでいく。<br /></p>
			<p><br />

			<h3>２人の夢追い人</h3><p>
			静かな雨を注いだ雲が通り過ぎてから数日経った頃合いだろうか。<br />
			メンテナンス室で、今日も零(レイ)はカウンセリングを通し93(クミ)の調整を行っていた。<br />
			<br />
			「－－という状況だね。気に病むところはあると思うし 法的には君が咎められているとしても、仕方ないところは大いにあると思うよ」<br />
			零は記録(ログ)データを基に93(クミ)に状況を述べたうえで優しく語り掛ける。<br />
			「……あたしが、無茶な野望(ユメ)を掲げているからかな…」<br />
			93(クミ)は 哀しそうに俯いたのちに言葉を零した。<br />
			「他の皆ほど実績や成果も何もなかったのに、もっと先へ行きたいなんて望むから…だからあたしは、あんなことを言われて…」<br />
			（『理想ばっかり追ってないで 少しは現実をみたらどうだ』、か……やっぱり、根に持っちゃうよね）<br />
			93(クミ)の言葉を聴き、零は悟られないように表情を曇らせた。どうやら、93(クミ)の主人との間で心理的なすれ違いが発生しこの事態になったのだろう。<br />
			<br />
			ナンバーテールズの活動は、主従契約を基本とする契約者の生活支援が主体となっている。しかしながらヒューマノイドと人間の間に万が一のことがあれば、先程の厳重なヒューマノイドの法的規制が相まって 只事では済まないだろう。<br />
			しかしながら百花繚乱研究所には、感情機能の暴走を抑止する独自のモデレーション体制や 主人とのミスマッチが発生した際の法的かつ公平な解決方法などといった、実際の経験で十二分に蓄積されたヒューマノイドの感情機能の扱いについてのノウハウがあった。尤も、この様な人間とヒューマノイドの間にできる主従関係でトラブルが発生したのは、目標が高すぎた93(クミ)の件も踏まえ この限りではないのだ。<br />
			<br />
			零「…そんなことないよ。人間が一つの大きな目標のために頑張るのと同じように、感情を持っているなら無茶だって高望みだって掲げても 私はいいと思う。思うことはあると思うけど、いまこうして休みを与えられたのも その夢が絶対に叶わなくならないようにするためのものだと思っていればいいよ」<br />
			93「……でも…」<br />
			零はさりげなく、93(クミ)の丸く柔らかい躯体を優しく包み込む様に撫でている。<br />
			93「…うぅ…そんなに抱き締めたり撫でたりしないでよ零…何だか恥ずかしい…」<br />
			零「……あ。いやぁ…久々にコアフォルダのまんまるふかふかを拝めた気がするから、つい…ｗ」<br />
			零は93(クミ)の哀し気な様子が落ち着いたことに安心したのか、93(クミ)のメンテナンス状況についての記録にチェックを入れる。<br />
			「とりあえず、３ヵ月はここでゆっくり過ごしていてね。復帰に備えて定期的に調整(チューニング)もしていくし、いつかは93(クミ)の夢もちゃんと叶えさせてあげるから」<br />
			零はそう93(クミ)と顔を合わせて微笑み掛けた。<br />
			「…うん！」<br />
			93(クミ)も心成しか安心し頷いた。<br />
			<br /></p>
			<p><br />
			一方その頃。ある学生寮で一人の少女は通話越しに誰かと話していた。<br />
			デスクには付箋やマーカーで書き殴られた教材が所狭しと置かれており、壁には「一発合格」と力強く書かれた習字が威風堂々と飾られている。<br />
			「－－うん、試験勉強は順調だよ。まだまだ勉強できるところはあると思うけれど…」<br />
			少女はそう言って、書き込みを終えた１冊の問題集を見つめては閉じた。<br />
			通話越しに、機械の様な男性の声が流れる－－39(サク)の声だった。<br />
			「そうか、それはよかった。それなら契約通り、来週末あたりで満期でも問題は無いな」<br />
			39(サク)は一息吐いてそう少女に呼びかける。<br />
			<br />
			彼女は乃木 希(のぞみ)。専願している国立機構の入構試験を半年後に控えて勉強中だ。<br />
			「…契約が終わったら、本当にうちには来てくれないのかな？まだ私一人では心もとなくて…」<br />
			席を立ち、壁の方へ歩んでは通話越しに39(サク)に問いかけた。しかし音声だけの39(サク)はドライな口調を変えることはなく淡々と応える。<br />
			「俺たちの力を借りるにも、早くて数ヵ月は必要だろう。俺との契約も、本当は料金や契約条件を揃えるのが厳しかったのではなかったか？」<br />
			「…でも……」<br />
			少し通話の会話が詰まり、39(サク)の声は背中を押す様にこう希に言い残した。<br />
			「……気にするな相棒。今のお前なら、もう問題無く過ごせる。後はお前次第だ」<br />
			「…うん。今まで本当にありがとう、39(サク)」<br />
			その39(サク)の声に励まされたのか、希は通話を閉じた。<br />
			暫く希は呆然としていたが、視界の向こうにある掛け時計を見て「…いけない。もうこんな時間だ…塾に遅れるから急がないと」と支度を始める。<br />
			<br />
			少しして、希は鞄を抱えながら駆け足で学生寮から出掛けて行った。<br />
			（……行ったか）<br />
			建物の裏陰から、39(サク)は肩の力を抜く様に見送った。<br />
			「隠れて様子見なんてらしくないね、39(サク)」<br />
			付き添いなのかはわからないもう一人の人影が、39(サク)を興味深そうに見つめている。<br />
			「……うるさいな…たまにはいいだろこれくらい。というか、お前は普段から裏で何やっているかわかんないんだよ 10(ミツル)」<br />
			39(サク)は呆れる様に訝しみながら人影こと10(ミツル)とこの場を後にする。<br />
			10「言ってくれるね。でも生憎、ボクのやっていることは公にするほどでもないし、ボクにしかできない役目だから代わってもらうこともない－－あまり各々の活動に干渉しすぎない方がいいよ」<br />
			39「それはどの口が言っているんだよ……」<br />
			10「あぁそうそう。一つボクからキミに提案があるんだけど」<br />
			建物の裏陰を縫う様に歩く２人だったが、10(ミツル)はふと39(サク)の目前へ追い越すように立ち回る。<br />
			「…ん～しかし、ちょっと折り合った話になるから場所を変えた方がいいか」<br />
			まるで演技かのように、腕を組み顎に片手を当てながら10(ミツル)は言葉を濁す。<br />
			「提案も何も、お前の裏話に興味はない」<br />
			39(サク)は溜息とともに、10(ミツル)の横を通り過ぎる。<br />
			<br />
			その瞬間、10(ミツル)は瞳と声の色を変えてこう39(サク)に問いかけた。<br />
			「…へぇ…キミの妹の復帰に関することでも？」<br />
			「…!!!」<br />
			39(サク)は足を止めて、とても険しい顔で10(ミツル)の方へ振り返る。<br />
			「お前……93(クミ)の何を－－」<br />
			10(ミツル)は怖気付くことなく、「興味ある話でしょ？」と言いながらにやけるように微笑み掛ける。<br />
			「－－ちっ、気が変わった。聞かせてもらうぞ」<br />
			「じゃあ、百花研でいい面談場所があるからそこに行こうか」<br />
			２人はそう言葉を交わし、裏路地の中へと消えていった。<br /></p>

			<h3>プロローグ</h3><p>
			暗闇と雨音の中に、崩れ落ちる様な音が雷の轟音に打たれるかの如く 人知れず静かに鳴いた。その瞬間に、歩行者用の青信号の仄かに点滅していた光が消え 赤信号の光が静かに滲む。<br />
			<br />
			人気の居ない横断歩道を背に、一つの人影が人の形をした…いや、畳むように縮小していく人の形だった影を抑えるように宥める。<br />
			「－－対象個体の鎮圧を確認。回収してこれからそっちに向かうよ」<br />
			影を片手で抑えながら、通信機らしき箇所を他方の片手で抑えて言う。雑音交じりの通信音声が鳴り、その声が他の誰かに聞かれぬまま雨音と静寂に溶けていく。<br />
			「－－わかった。稼働再開後しばらくはひどく落ち込んでると思うから、恐らく手を焼くと思うけど 頼んだよ」<br />
			そう言って人影は、アタッシュケースと同じ様なシルエットに収まった相手の影を持ち、背を伸ばして遠くのどこかを眺めるように佇んだ。<br />

			「…やれやれ。彼女もまた、可哀そうなことになったね」<br />
			雨音と共に、中性的な声で人影は言葉を零す。<br />
			「彼女の主人クンとずっとすれ違い続けて、しまいには『理想ばっかり追ってないで 少しは現実をみたらどうだ』なんて言われてさ……ヒューマノイドに感情が伴ってきたのもつい最近だというのに、何を言っても咎められないと少しでも思ってる人が まだそれ並みにいるものだね」<br />
			人影は戯言の様な皮肉の様な声でそう言った。その後、誰にも聞き取れないよう注意するかの如く、<br />
			「……『ディケ』もきっと、悲しむことだろうよ」<br />
			と秘かに呟く。<br />
			<br />
			雷がまた一つ、遠くの街影で轟いた。<br />
			「－－悪いね。また感情的になってしまった」<br />
			再び雨音だけの静寂が周囲を包む。人影は通信音声の声を静かに聴いている。<br />
			「－－察しが良くて助かるよ。さて……彼女のケアは零(レイ)に任せるとして、この状況は法務沙汰になるね」<br />
			そう言って人影はもう一つの影を持ち上げ、この静寂と孤独の闇を立ち去ろうとする。<br />
			「－－軽い活動謹慎で懲戒処分が済むことを願うばかりだ……ごめんね、『93(クミ)』」<br />
			そう、誰かに話し掛けるかの様に、人影は呟やいた。<br /></p>
			<p><br />
			－－「ナンバーテールズ」、それは双子の天才大学院生「零 零(カズナイ レイ)」と「零 百(カズナイ ハゲム)」によって開発された、妖獣型自律生活支援ポータブルヒューマノイド。<br />
			ヒューマノイドと人間同士の共存は「第７の世界破壊：人権問題の高度化」の一つに匹敵するほどの倫理的なパンデミックを招いたが、幸いにも数年前に収束したばかり。<br />
			ヒューマノイドが「第７の世界創造：人類の拡張」の産物として本来の需要が高まり、同時期に発生した第８の世界創造および世界破壊もようやく安寧のフェーズに入っただろう。<br />
			<span class="p-small">…っと、話が脱線してしまった。いけないね…慣れない話し方を続けた所為で、ちょっと余計なことまでどうしても語ってしまうや。…ｺﾎﾝ。</span>詰まる所、ヒューマノイドが人間と共存するようになったのはかなり最近だが、この時点でも100体近くのナンバーテールズが生産され 人々の生活を支えている。<br />
			これは、ナンバーテールズが主人にご奉仕と支援を重ね 人々と生活を共にする物語……
			<br />
			<span class="p-small">……</span><br />
			やっぱ割に合わないなこの話し方、幾らセンパイに頼まれたこととはいえ、「ディケ」に見られてたらちょっとボクも恥ずかしいしな～……<br />
			…あ、これを読んでるキミはいったん僕が語り手口調を辞めたことは いったん忘れてね。この仕事を吹っ掛けてきたヒトには内緒にしておきたいからさ。<br />
			<br />
			それじゃ、この後の物語をどうぞお愉しみに－－<br />
			<span class="p-bold">(To be increase count of their story(続く)…)</span></p>

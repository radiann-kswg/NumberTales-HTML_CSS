			<h3>ある主従契約記録にて</h3><p>
			「……それで、39(サク)は主人(クライアント)君と実績を遺せたわけね。例の如くあまり平和的ではないけど…」<br />
			俺たちナンバーテールズの開発者であり、俺らの人格を保守・管理している零零(カズナイレイ)はそう言って、俺と相棒が築き上げた契約記録を読み返す。<br />
			「…相棒を努力を蔑ろにした奴を見返せただけ十分だろう」<br />
			「いや あんたのすることだし、そうかもしれないけど…」<br />
			零は少し呆れたかの口調で活動記録をデスクに置いて、俺と正面から向き合う。<br />
			「いい？あんたたちナンバーテールズは人間を“支えるため”にあるの。そのためだけに他の人間とドンパチしないようにだけは、今後善処してくれないかな？いくらあんたの相棒である主人が喧嘩吹っ掛けられたのが許せなかったとしても、ヒューマノイド原則法は絶対に守って」<br />
			<br />
			ヒューマノイド原則法。それは俺たちヒューマノイドが世に出回るようになってから制定された、ヒューマノイドが人間と共存するための最低条件を示す法律だ。<br />
			- 第零条：全人類および全ヒューマノイドにおける脅威を起こしてはならない<br />
			- 第一条：第零条に違反しかねない場合を除き、ヒューマノイドおよび人類は 他のヒューマノイドまたは人類に危害を加えてはならない<br />
			- 第二条：以上に違反しかねないを除き、ヒューマノイドは人類の指示・命令に従い 人類およびヒューマノイドはこの関係に反してはならない<br />
			- 第三条：以上に違反しかねないを除き、ヒューマノイドは自己をあらゆる危害から護らなければならない。<br />
			零曰く今回の俺の場合、危うく第一条を違反しそうになったとのことらしい。<br />
			<br />
			「……すまない」<br />
			俺は怒りで失われた冷静さを取り戻し、相棒の敵に成してしまったことを後悔した。<br />
			「…でも、君の相棒君からのレヴューはとてもよかったよ。読んでみる？」<br />
			そう言って表情を和らげた零が、もう一つの資料を手に取って俺に差し出した。少し拙い相棒の字が綴られている。<br />
			<br />
			－－ 今までクラスメイトに馬鹿にされて 私の憧れていた就職先を諦めかけていたけど、39(サク)のおかげで自信がもてました。内定はまだまだ先だけど、彼にはとても感謝しています。お礼がしたくてたまりません。ありがとう、相棒。　　契約主人：乃木 希<br />
			<br />
			「（ｺﾝｺﾝ）…零。ちょっといいかしら」<br />
			メンテナンス室のドアをノックする音とともに向こう側から声が聞こえた。<br />
			「9(チカ)？今行くよ。39(サク)はここで待ってて」<br />
			そう言って、零は席を後にする。<br />
			<br />
			「……礼には及ばない、俺はお前の相棒だからな」<br />
			俺は呟いた。<br />
			ドアの向こうで、少し穏やかではない会話がされていたことも知らずに－－</p>

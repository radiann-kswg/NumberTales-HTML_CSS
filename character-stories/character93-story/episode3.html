		<h1>ナンバーテールズ キャラスト作品<br />第1編 93(クミ)編</h1>
		<h2>第３話</h2>
		<div style="width: 100%; margin-bottom: 20px;" id="app-characterstory-page">
			<characterstory-page-comp>
			<template #contents>
			<h3 class="h3-wide">スリーズvsフォーズ part.1</h3><p>
			秋雨の日々だった9月が明けて少しした頃。11月も下旬に差し掛かり、晴れて予定より早く93(クミ)は稼働再開を迎え、兄個体の39(サク)と再び立ち入りが許可された研究室構内の一般開放エリアを散策していた。<br />
			先程、93(クミ)にとっては３か月程ぶりとなるナンバーテールズのクラスメイト間で進捗を交換し合うクラス会議だったのだが、彼女の所属するデュアルスリーズのクラスメイトの進捗を耳にした93(クミ)の表情は、暗い程はないが然程明るくもなかった。<br />
			「この数ヶ月の間、まさかみんなにあれだけ差をつけられてたなんて……やっぱり、くよくよしてる場合じゃない…!!」<br />
			93(クミ)は敗北感と焦燥感を意欲に切り替えようと必死に自分を鼓舞するものの、その足取りはなかなか軽くはならない。<br />
			「まぁ無理もないだろう。それに、お前はまだ復帰の初動が保証されているのだから、そんな気負い過ぎるな」<br />
			39(サク)はそう言って、93(クミ)の頭を不器用ながらにそっと撫でる。<br />
			<br />
			希から93(クミ)の契約希望を受けたのはつい数日前のことで、来週には契約成立のためのマッチング面談が行われる予定だ。面談は、契約希望者と対象のナンバーテールズ、零(カズナイ)姉弟の４者で行われる。93(クミ)の一件もありこの面談の選定精度はさらに強化されているため、ナンバーテールズの主人となる希望者との会話や雑談を通じてナンバーテールズの状態を見ることで適性を見る方式で行われるらしい。つまり、ラフに接してもらうことがアイスブレイク要因でもあり相性を迅速に判断するための手段でもあると、零は判断したのだ。<br />
			39「－－そう考えると、まるで人間のやる企業面接みたいだな」<br />
			93「あたしたちナンバーテールズも、人間と対等に扱ってくれる……ってことなんだろうな」<br />
			39「……あぁ。きっとそうさ」<br />
			<br />
			そう他愛ない会話をしていた兄妹はふと、購買コーナーの窓越しに２体の他個体が資料を大量に買い漁っている場面に直面する。<br />
			窓の向こうから「試験取得には実務しかないだろう」「いいや、情報エンジニアが有力」と、若干言い争っているまである声がわずかに聞こえてくる。<br />
			93「お兄ちゃん……あれって、31(ミツイ)と49(ヨチカ)…だよね？」<br />
			39「あぁ……あいつら、まだ“あれ”を引き摺ってやがるのか」<br />
			そう遠くから様子を見ていた兄妹だったが、居ても立っても居られなくなった39(サク)は$[ruby 徐 おもむろ]に購買コーナーへ向かってずかずかと踏み入った。<br />
			93「えっ、ちょっとお兄ちゃん!?」<br />
			39「<span class="small">首突っ込みたくなかったらお前はここで待ってろ(※小声)</span>－－おいお前ら。そんな専門書を爆買いして予算どこから出すんだよ」<br />
			自動ドアを割り込むように39(サク)は31(ミツイ)と49(ヨチカ)の隣に迫り、それに引き摺られるかのように93(クミ)もおどおどと続く。<br />
			49「なんだよ39(サク)、君らには関係ないことじゃん。ちゃっかり復帰したばっかりの妹まで連れてさ」<br />
			31「うむむ…私らのクラスのことだからあまり関わらないでって先月言ったばっかりなのに……」<br />
			39「実務能力か技術能力かのどちらかさえ目的も定まってない状態で本棚の積み本を増やす真似のことか？全く、呆れたものだ。今年9月からこれまでにないくらい無計画すぎるだろうお前らは……」<br />
			31「ぐむむ……言われてみれば…」<br />
			49「…ちっ、わかったよ」<br />
			39(サク)の仲裁？で懲りた２人は、カートの中に大量にあった専門書を丁寧に戻しに行った。<br />
			<br />
			「お兄ちゃん……デュアルフォーズに、何かあったの？」<br />
			93(クミ)は少し困惑した様子で恐る恐る39(サク)に訊いた。<br />
			39(サク)は、小さく溜息を零しながらこう答える。<br />
			「お前が捕まった数日後あたりから ナンバーテールズの契約キャンセル率が一時的に増えたことで、実績不調となったデュアルフォーズの連中が焦りだしてるらしい。特に49(ヨチカ)はその一人で、31(ミツイ)や76(シチロク)は新しい面談制度でマッチング率が落ちたと聞いている。そんな中、49(ヨチカ)の頭がついに湧きやがって『デュアルフォーズ全体で目に見える実績を出せ』と発破かけ出すようになってから、今まであんな調子だ。全く……“計画通りの実績を出す”のがあいつらデュアルフォーズのブランドだっていうのに、計画だけでなく気も狂ったみたいだな」<br />
			本を正しい位置に戻していくデュアルフォーズの２人を横目で見ながら答えていた39(サク)だったが、目線の先にいる２人の挙動は多少の苛立ちや落ち着きなさが見え隠れしている。<br />
			<br />
			すると、49(ヨチカ)の口から強い皮肉が込められた言葉が零れてしまう。<br />
			「……なんだよ。スリーズから暴走個体がでなけりゃ、こんなことならなかったのに」<br />
			その言葉は、3+9型兄妹の逆鱗に触れてしまった。<br />
			「あぁ…？いま、93(クミ)のこと馬鹿にしたか!!!」<br />
			39(サク)は形相を鬼のように顰(しか)めさせ、49(ヨチカ)の胸倉を荒々しく掴んだ。<br />
			31「やめなよ２人とも!!!」<br />
			93「ふざけないでよ!! あたしだって……あたしだって!! 好きであんな目に遭ったわけじゃないのに!!!」<br />
			一触即発な状態が弾け飛んでしまったその時、自動ドアの向こう側から１人の個体が93(クミ)の背中を優しく叩いた。<br />
			「そうだよね。君もきっと、悪気があったわけじゃない。そんな君たちの理不尽を理不尽に遭った人の所為にするのは良くないよ」<br />
			「…!?」<br />
			喧嘩に発展しそうになった４人の視線が瞬時に93(クミ)の背中にある人影に集まる。<br />
<br />
			その目線の先にいたのは－－ナンバーテールズ３号機の「3(ナオ)」だった。<br />
			<br />
			<br />
			一方その頃。メンテナンス室のデスクで業績報告書や過去の始末書を拡げ、それらを俯瞰するように眺めていた零と$[ruby 百 ハゲム]は、真剣な顔で話し合っていた。<br />
			零「49(ヨチカ)たちデュアルフォーズの皆の件、百はどう思う？」<br />
			百「どう思おうとも、ハードウェア上は正常なんだ。その答えを決められるのは、どちらかというと零の方だろう」<br />
			零「いや、そうなんだけどさ……なんだか、93(クミ)の懲戒処分をきっかけに$[ruby 思考 ロジック]の挙動がいつもと違う気がするんだよね」<br />
			百「いつもと違う…？」<br />
			零「以前のあの子なら……本当なら、あの子らの契約も成立するはずなんだよね。例を挙げるなら、この先月契約をキャンセルされたばかりの……これとか、これとか…」<br />
			そう言って、零は数枚の見積書を指さす。見積書には『キャンセル』または『不適合』と赤く大きく書かれ、契約が成立しなかったことを記している。<br />
			「……もしかすると、彼女たちに何らかの$[ruby 例外 イレギュラー]が発生したことで、彼女たちの特性が……“カバラの加護”が、不安定になっているかもしれないんだ」<br />

			<h3 class="h3-wide">不利劣勢を超えて</h3><p>
			「－－不安定？」<br />
			百(ハゲム)]は零(レイ)の横顔を窺うように見て、そう言葉を復唱した。<br />
			“カバラの加護”、ナンバーテールズらが知らず知らずに宿している潜在能力のことをそう２人が呼称している。ある個体は主人の運気を操り、ある個体は主人の心理状態に作用し、ある個体は状況すら影響を及ぼすとされる、神秘の力。<br />
			しかし今、そんな“カバラの加護”が不安定になっていると零はいう。<br />
			零「確証は得られないけど、人間と同様にヒューマノイドである彼女らも何らかの心理的負担(ストレス)や社会的圧力(プレッシャー)で理論値よりもパフォーマンスを得られないケースが何件かあるように思うの。その原因として一番考えられるのは、主人との同調や共感性に欠陥があるとき……そう仮定すると、49(ヨチカ)と93(クミ)が現在 最悪の体調状態(コンディション)にある」<br />
			百「でも、ならばどうする？“カバラの加護”はもとより 統計学的にしか効果を証明できかねるブラックボックスで、だからこそ社会に運用することがこの潜在能力の存在を定義するための絶対条件のはずだ。それが僕らの研究目的だというのに、まだデータも取れてない状態でどう安定化するつもりだ？」<br />
			<br />
			そう百が問うている間に零は何か一つの結論に達したかの如く、デスクに広げた書類を一つ一つまとめ始めてこう答えた。<br />
			「仮説は十分に揃っているから、あとは一か八かで検証すればいい－－彼女らのフルパフォーマンスを発揮できる状況を、再現するんだよ」<br />
			<br />
			<br />
			その頃、49(ヨチカ)の失言により一触即発となっていた売店周辺では、基本個体である3(ナオ)の仲裁が入ったことで事なきを得ていた。この後も49(ヨチカ)は終始機嫌が悪い様子で、3(ナオ)が間に入ったことで都合が悪くなったと態度で示すように 31(ミツイ)を連れてそそくさと去っていった。<br />
			39「まったく……本当に済まない、3(ナオ)」<br />
			3「気にしないで。フォーズの事情も横耳に聞いているけど、あっちもあっちで93(クミ)と同境遇だというのは知っているから」<br />
			立ち去っていくフォーズの２人を横目にしつつ、振り返った3(ナオ)は93(クミ)と向き合う。<br />
			93(クミ)は憧憬の的だった先輩個体を前に、戸惑っている様子を見せながらも どこか輝かしい目で見つめ合うように言葉を一瞬呑んだのち、「……あ、ありがとう……ございます…」という縮こまった声で礼を言いお辞儀をする。<br />
			すると、3(ナオ)はこう93(クミ)に言葉を呼び掛けた。<br />
			<br />
			「－－先で待ってるよ。頑張ってね」<br />
			その言葉は93(クミ)の心に残響し、その場を後にする3(ナオ)を華やかに送るように余韻を残した。<br />
			<br />
			<br />
			後日、93(クミ)はいよいよ新たな主従契約についての話があると零にメンテナンス室へ呼び出される。同室には39(サク)も相席していた。<br />
			零「復帰して最初に契約してもらうのは、この間39(サク)と契約していた乃木 希(のぞみ)という高校３年生の子だ。一度ナンバーテールズの主従サービスを経ているから、ベータリリース中かつ一度トラブル経験もあった93(クミ)でも安心して主従できるだろう。何より、君と同じ高い夢を持っているからきっと意気投合するよ」<br />
			93「あたしと、同じ…？」<br />
			39「ああ。彼女は数年前までの成績も劣勢で循環機関に難があるが、それでも親の叶わなかった夢として、一度 命を救われた職への憧れとして救命士を目指している。第一志望は、夜月機関付属大学の医学部……といったところだろうか。俺が彼女に主従するにあたり、十二分な熱意と意欲をいつも感じている－－不利かつ劣勢を超えて、ただ一つの夢へ前進している強い奴だ」<br />
			そう２人の紹介を聴き受け、93(クミ)の不安と緊張に満ちていた顔は 次第に期待と情熱で明るみを取り戻していく。<br />
			その様子を横で見つめて話を進める２人も、93(クミ)の立ち直りっぷりに明らかな確信を得たのか微笑み返す。<br />
			零「君には、どんな逆境を乗り越えてでも人の夢－－野望を叶える力があると思う。喩え何回その道を踏み外しても その先にあるただ一つの到達点に辿り着けるなら絶対に負けない、そんな強い意志を君のキャリアが与えてくれると信じているんだ。これから出会う主人(彼女)のように、君もそのもう一人として」<br />
			93「……零…、あたし……頑張る！」<br />
			<br />
			そう背中を強く押された93(クミ)は、明日いよいよ希と対面する。ここから彼女のキャリアが大きく飛躍することを、もう一度期待して。<br />
			<br />
			<br />
			その夜、デュアルフォーズの稼働待機部屋では また新たな(イレギュラー)が発生しようとしていた。<br />
			８人態勢のクラスであるデュアルフォーズの充電台には コアフォルダ形態となった７体のナンバーテールズが眠りについていたが、残りの１体である49(ヨチカ)だけが共用デスクに鎮座して作業していた。<br />
			（……実績も中途半端なままのくせに、平然と寝てるんじゃないよ）<br />
			49(ヨチカ)はデスク周辺の収納の中にある書籍を片っ端から引き抜き、一つ一つ 一頁(ページ)一頁読み取ってはデスクの横に置くのを繰り返していた。それはまるで過学習してしまったAIの暴走のように、ゲシュタルト崩壊を起こし取り乱した人間のように、単調作業でありながら49(ヨチカ)自身にまるで無意味に意味を見出しているかの如く 奇妙なほどに丁寧で迅速な作業だった。<br />
<br />
			（こんな実績弱者なクラスで終わらせて溜まるか。ボクは絶対に このクラスを、デュアルフォーズを実績強者にする－－最短かつ効率的に!!!）<br />
			月明かりも差し込んでない暗闇の中の待機室の窓に、49(ヨチカ)の狂気じみた手捌きの影だけが 不気味に$[ruby 蠢 うごめ]いている。<br />
			</p>
			<p class="p-bold">(To be increase count of their story(続く)…)</p>

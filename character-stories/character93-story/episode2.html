			<h3 class="h3-wide">93(クミ)の野望(ユメ)</h3><p>
			93(クミ)が開発され、人々の元へ主従活動が始まったころから１年ほど前のこと。<br />
			<br />
			百花繚乱研究所としてではなく、開発者である零(カズナイ)姉弟が在籍する名門大学院の卒業研究として ナンバーテールズの開発プロジェクトが展開されていたが、博士課程に歩を進めたある日 偶然にもヒューマノイドに潜在能力が搭載可能であることを発見した。<br />
			しかしその潜在能力を学術的に確かめるには 潤沢なデータが必要であり、百種類程度の個体が人間と交流することでしか実現できず、あまり現実的ではないものだった。<br />
			だが零零(カズナイレイ)はその爆発的なコストも恐れず、九蓮国トップの技術機関である夜月機関へ 共同して事業展開するよう交渉することで、無事 潤沢な資源の確保と開発効率化を図った。その結果が、現在こうして行われている百花繚乱研究所のヒューマノイド事業の展開に繋がったのだ。<br />
			<br />
			尤も先日も触れた通り ヒューマノイド事業には幾つかの制約があり実現は困難とされており、当初こそスタートアップの実現が失敗に終わるのではないかという懸念が大いにあった。<br />
			だが その中で１体のナンバーテールズが事業実績の先陣を切り 後続に繋くことができた。<br />
			守破離の三位一体を極めた学習力と行動力、老若男女を問わず接しやすい気質を持つ性格設定とコミュニケーションスキル、中性的で純粋無垢な少年を思わせる友好的な外見。天性のムードメーカとさえ感じ受けられるその個体は、相手がヒューマノイドであるにもかかわらず強い愛着を呼び、実績を瞬く間に生み出してくれたと 零は言う。<br />
			その個体の名は ナンバーテールズ３号機、通称「＃3(カズノナオ)」と呼ばれている。<br />
			後続個体の93(クミ)も、この先輩個体に匹敵する実績を手にして同じ場で活動したいという 強い憧れと野心を示していた－－<br /></p>
			<p><br />
			「単刀直入に言うと、酷い状態だね。ドライバ回路がヒートアップしているし 関節部も普通じゃ考えられないノイズと負荷が掛かってる」<br />
			現在に戻り、零と百(ハゲム)は引き続き93(クミ)の調整に当たっていた。暴走寸前となっていたためか、ヒューマノイド躯体にも負担が掛かっており 少しの間 調整が必要だったようだ。<br />
			零「法的措置が下されて復帰予定まで残り２ヵ月だけど…、なんとかして最短で復帰できるようにはできないかな？」<br />
			百「最短で復帰、か……主人(クライアント)君との相性に恵まれず運が悪かったといえ、心理的に壊れたり慢性的に負担が掛かり続けたりすると いずれ身体まで蝕まれる。人間もヒューマノイドも同じさ」<br />
			そう言って百は、休止している93(クミ)にメンテナンスを終えたパーツを再搭載しながら溜息を零す。<br />
			零「やっぱり、それだけ心身に負担が掛かってたってこと？」<br />
			百「生憎その認識であっているよ、法的に３ヶ月も活動を止められているだけ不幸中の幸いと思った方が良い。この状態じゃあ、起訴されずに次の主人(クライアント)君と主従活動を展開することになったところで きっと今以上に良い結果にはならない」<br />
			搭載を終えた百は93(クミ)の外装フレームを閉じて零の方を向いた。真剣な目つきでありながら、何かを憂うように託す表情をしている。<br />
			百「…この身体(ハード)を最大限に活かすために、今は彼女の心理状態(コンディション)やアフターケアのことだけを考えてくれ。彼女の夢を、完膚なく叶えてあげるためにも」<br />
			その言葉に零は少し表情を曇らせながらも「……わかった。任せて」と応じ、調整を終えた93(クミ)を引き受けその場を去った。<br />
			<br />
			その後メンテナンス室に戻る途中、零は93(クミ)がこのような様態になる前にした話を何度も思い返していた。<br />
			「いつか先輩に認められたい」「あたしの野望(ユメ)を叶えるためにも こんなところで止まってられない」「絶対に諦めたくない」、そのような彼女の言葉が 何度も何度も零の脳内を過る。<br />
			零（私(あたし)らが生み出した以上 娘のような存在であるナンバーテールズたちの夢を叶えてあげることは、生みの親としての責任だ。確かに実現のためにも今は休息を余儀なくされるけど、このままじゃ快復したところで きっと同じミスマッチを繰り返す……何もしないで勝機を待ってるような場合じゃない）<br />
			<br />
			その夜。零は深夜にもかかわらず、眠っている93(クミ)を傍に 真剣な眼差しで画面を舐めるようにデータを整理していた。<br />
			デスクの机上を覆い尽くすように置かれている機密文書の表題には、「“カバラの加護”」という文字列が所々に散見されている。<br />
			零（93(クミ)と主人(クライアント)君の相性がなかなか優れなかったことに関して、きっと何か手掛かりがあるはず…）<br />
			その時、１通の通知がデスクに着信していたことにふと視線が行った。<br />
			零（……39(サク)…？）<br />
			恐る恐るその通知を開き、零はメッセージの内容を読む。<br />
			すると、緊張と睡眠不足と不安で顰(しか)められていた零の表情か一気に緩み、安堵(あんど)の笑みが浮かんだ。<br />
			零「…そうか、その手があったか……!!」<br />
			零はそう言葉を漏らしたと思えばその瞬間 机上の書類と筆記用具を徐(おもむろ)に手に執り 荒ぶるように勢いよく筆を走らせた。瞬時瞬時の間に零の視線が画面とペン先と他の紙面を反復横跳びの様に移動しては 書類から書類へとペン先が移動してその先にある文字列や文章にマーカー線が引かれて注釈が追記されていく。<br />
			<br />
			十数分の乱舞ののち 零は少し乱れたトーンで一息吐いて、１枚の契約履歴を印刷して手に執った。<br />
			「……彼女(あのこ)ならきっと、相性は抜群なはず…!!」<br />
			そう強気に呟き、零は夜の静寂を乱さぬよう静かに笑った。<br />
			<br /></p>
			<p><br />
			翌朝になり、九蓮国の街を静かに日が照らす。<br />
			零姉弟は第三県郊外地区の一角にある学生寮の目の前に訪れた。寝不足の脳を抱えながら零は部屋番号を確認するが、年季がやや入った建物で部屋番号や名前の表記が荒んでいる所為か、目的の部屋が見つからない。<br />
			零「あっあれ……た、たしか…203号室だったはずだよね…？」<br />
			百「朝から何しているんだよ零…、住所も読めないくらい寝てない所為で 判断力が鈍ったか…？」<br />
			そうしどろもどろしている零とそれに呆れる百だったが、なんとか目的の部屋のインターホンを押す。<br />
			<br />
			インターホンから乃木希(のぞみ)の声が応対した。<br />
			希「えっ…？あなたたちって…」<br />
			零「休日の朝からごめんね。先月は39(サク)がお世話になったよ。今度はこっちから営業掛けるようで申し訳ないけど、ちょっと時間貰えるかな？」<br /></p>

			<h3 class="h3-wide">九十九神(つくもがみ)計画</h3><p>
			希「そんなことがあったんですね……」<br />
			百花繚乱研究所の事情を代表の姉弟から聴いた希(のぞみ)は、数枚のレポートを俯瞰して呟いた。<br />
			希の視界にある最上面のレポートには、過去に人間とナンバーテールズとの間で起こったインシデント事例などの概要について「九十九神(つくもがみ)計画」という題目で簡潔に纏められている。グラフは、人的危害やハラスメントの項目が過半を占めていた。<br />
			零「39(サク)と君との契約が満期を迎える頃に、この子がいじめを受けてしまって……このままだと私(あたし)たちの事業が成立できなりそうなの。いくらでも交渉に乗るから、一度検討してくれないかな？」<br />
			希「……」<br />
			零の言葉とレポートの内容を嚙み砕きながら希は項垂れた。<br />
			<br />
			営業の内容は、懲戒処分を終えた93(クミ)との契約についてだった。勿論 希の前で93(クミ)が人前で暴走寸前となり法に触れたことは伏せられた上での紹介だったが、夜間突発的に作成されたであろう実績やスペックなどの資料を読み ふと39(サク)の様子を思い返して勘を働かせた希に、零(カズナイ)姉弟は包み隠し通すことは困難だった。そこで第二手段として隠し持っていた法人に協力を促す為の抜粋資料をその説明に使用したのである。<br />
			<br />
			零「この子も、最初は君と同じように大きな目標に向かって頑張っていたんだけど、なかなかそれを理解してくれるクライアントに恵まれなくて……だから、境遇の似ている君となら、巧くやれる気がしたの。勿論、無理な営業だったら強要はしないけれど…」<br />
			その後、少し間をおいて希は整理しきれない情報を零すようにふと、こう言った。<br />
			「やっぱり、ヒューマノイドだからって意地悪してしまう人がいるんですね……39(サク)にはとても助けられたのに、そんな優しさも知らないで…」<br />
			<br />
			その時、静かに鎮座していた百(ハゲム)は熱が入ったように語り始める。<br />
			「機械に感情や人格は不要、そう思った矢先にこんな扱われ方を許していいものと僕は思えない。そのために僕と零(レイ)は、ナンバーテールズに敢えて感情や人格を与えるように決めたんだ。確かに無感情や無人格の方が技術を運用するうえで正確な結果が得られるし、機械にとっては邪魔かもしれない。でも、機械だって人間の価値観やアイディアから創り出せるもので、それは感情や人格そして自我があってこそだ。今は技術が人間を上回ろうとして、人間ができないことを技術が実現してくれる世の中なのに、人間はいつもそんな技術を恐れて権利を制限して、さらには悪用や卑下することばかりだ。そんなことが、技術を創り出す中で望まれているなんて、そんなこと 僕は到底……」<br />
			呪詛のような発言をつらつらと漏出され、場の空気が濁っていく。<br />
			希「百さん…？」<br />
			百「……!! ごめん、つい…」<br />
			希のきょとんとした反応を見てはっと我に返った百は、首を横に振って気を取り直した。<br />
			零「あぁ、気にしないで。技術者として、彼は自分の創ったものが蔑ろにされるのが苦手でさ……それで、私たちはこの『九十九神計画』というのを一つのヴィジョンに掲げているの。要約すると、ナンバーテールズには感情や人格・自我がプログラミングされていて、これにより彼女たちも嫌がらせを受けた時にすぐ対応できるようにしているんだ。これで少しはそういう当たり屋も懲りてくれるはずと思ってね」<br />
			そう言って、零はレポートをアタッシュケースにしまい 横に置いてある93(クミ)の資料を手に取り、希へ差し出す。<br />
			零「さて、話は戻るけど……この子が復帰するまで、あと２ヶ月ぐらいかな。問い合わせはいつでも受けるから、それまでに検討してくれると嬉しいよ」<br />
			そう言い残し、零姉弟は学生寮を後にした。<br />
			<br />
			零「……とはいえ、昨日冷静そうにしてた百もちゃんとあの件で逆鱗に触れられてて私は安心したな。怒りの臨界点を超えて賢者か仙人になっちゃったかと思ったよ」<br />
			研究所構内に戻った零は、休憩室で自動販売機のボタンに手を掛ける。取り出し口から２缶の異なるビールが出される。<br />
			百「お前……馬鹿にしてるのか？あと、寝不足でお酒なんか飲むな。ただでさえ悪酔いするのに、今度は構内で吐いて事故ったらどうする」<br />
			零「ん？これは百の分だよ。私のはノンアル」<br />
			そう零は言って、一方のビールを百に差し出す。<br />
			零「お疲れ様♪」<br />
			百「…零……それ、両方ともノンアルじゃないやつだよ…」<br />
			零「えっ……、あれ!? ほんとだ!!?」<br />
			百「……もうお前はいい加減寝ろ！」<br />
			<br /></p>
			<p><br />
			その夜、学生寮。<br />
			平日は常時勉学に勤しみ、休日の今日も零らの応対で頭を使ってしまった希は、頭が疲れてしまいなかなか寝付けられなかった。<br />
			ベッドから上体を起こし、棚の上に置かれている写真立てに目を向ける。２つの写真立てにはそれぞれ、39(サク)とのツーショットと幼少時の家族写真が飾られている。<br />
			「……母さん…」<br />
			<br />
			希の夢は、母親の果たせなかった救命士としての夢を代わりに叶えること。かつての母親も今の希と同様に、勉学に勤しみ夢の為なら努力も惜しまなかった。しかし母親には幼少からの持病があり、その途中で夢を諦める結果となってしまった。それを希が知ったのはおおよそ数年前、修学旅行中の事故により救命士に救われたことがきっかけだった。事故による後遺症は遺っているものの、境遇としてはかつての母親とおおよそ同じ。母親と希の境遇が合わさり、救命士を志す強い意志が芽生えたのだろう。<br />
			ただ、そのためには限界のある自分の身体で 高度な専門知識や技術力を会得しなくてはならない。不運にも別科の高校へ入学が決まった頃から決めた夢でもあるため、さらにこれから高校のカリキュラムから逸した専門的で実践的な進路へ変更するという不利が生じている。クラスでは周囲や教諭から畑違いで無謀な夢だと馬鹿にされるほどであった。<br />
			しかし、そんな中で道を切り拓いてくれたのが、百花繚乱研究所の提供するナンバーテールズの39(サク)であったのだ。<br />
			<br />
			希は夜な夜なベッドから降り、読みかけの教材が散在したデスクの上に置かれている93(クミ)の資料を手に取った。<br />
			（……人間を救うことも、ヒューマノイドを救うことも、恩返しをするには関係ないよね。39(サク)のおかげで、周囲に負けず夢が視界に届くところまで行けた。あの頃だってそうだ、私は救われてばっかりだから……今度は、私が救う番だ）<br />
			そう心に決めた希はスケジュール表を開き、今月と来月のページに記された予定を見返しながら、その翌月：12月のページを捲(めく)る。そして、空欄の多いページに「93(クミ)と契約予定」と書き記した。<br />
			より高く夜空を昇っていく月が、九蓮国の街並みを静かに俯瞰している。<br /></p>

			<h3>再挑戦</h3><p>
			希(のぞみ)に93(クミ)が紹介される少し前のこと。<br />
			百花繚乱研究所のサーバルームに、２人のナンバーテールズが入室していた。蕾(つぼみ)のように10の毛先を有する赤毛で大きな尾が、何行何列にも並んだ画面の前でこれまでいくつもの物事を俯瞰してきたということを背中で物語っている。<br />
			「こんなところまで呼び出して、いったいお前はあいつの何を知っているんだ？早く教えろ」<br />
			眉間に皴(しわ)を寄せた険しい形相の39(サク)は、10(ミツル)に回答を急かすように訊いた。<br />
			「まぁそう焦らないでくれよ。裁判はもう終わっているし、今更ことを急いだって彼女の状況が悪化する訳でもないからさ」<br />

			「ここの画面を見て欲しい」<br />
			そう10(ミツル)が言うと、指先の画面に映像が流れる－－<br />
			<br />
			『……なんでそこで辞めちゃうのさ！まだ次の資格も取れるはずなのに…』<br />
			「…うるさいな。もうこれでお前との目標は終わった、93(クミ)との契約も終わらせる」<br />
			『でも、不合格だったんでしょ!? 再挑戦しないの!?』<br />
			「…お前には、もう関係ない話だろ」<br />
			『なんでだよ!! まだあたしは……』<br />
			「いい加減にしろよ!!」<br />
			（ﾊﾞﾝｯｯ!!!）<br />
			『……っ』<br />
			「お前、俺の何に貢献したんだよ。結局お前がいようがいなかろうが、なんにも達成できなかったじゃないか!!」<br />
			『でも!!』<br />
			「何が一緒に夢を叶えたいだ、理想ばっかり追ってないで 少しは現実をみたらどうだ!!」<br />
			『……!!! それを言うなら、●●だってなんで理想に正直にやらないんだよ!! すぐに諦めてばっかりで、ずっと怠けて退屈にしてて、あたしがいなくても一緒なのは、君の所為でしょ!!』<br />
			「黙れ!!! たかがヒューマノイドのくせに、人間のこと解ったつもりになるな!!!」<br />
			「もうやめなさい●●！乱暴するようなら警察を呼ぶよ！」<br />
			<br />
			－－画面に流された１人の男性がこちらに向かって罵声を吐き出してくるような映像は、紛れもなく 暴走行動により回収される直前までで93(クミ)が見てきた光景だろう。傲慢で、怠惰で、しかしながら哀れな男性の様子は、もしかするのなら精神的に酷く追い詰められていたのかもしれないようなものだった。<br />
			39「……あいつ、こんなヤツに侵されてしまってたのか。胸糞が悪い」<br />
			10「あぁ。93(クミ)よりも先に、彼が暴走で止められていればよかったものをね」<br />
			39「それで、だからなんなんだ？お前がいう、93(クミ)が復帰するための方法というものは－－」<br />
			10「ならここで逆に思い返してみて欲しい、君が直近で契約した主人とのことを。そうすれば、君にだってわかるはずさ」<br />
			10(ミツル)は振り返った流れで、39(サク)の横を通り過ぎるようにその場を後にする。<br />
			サーバルームのセキュリティドアが開く音に耳を貸す前に、39(サク)は画面の方向へ向き直した。<br />
			映像が流された画面は、93(クミ)の視線をモニタリングするためのものだったらしい。彼女が活動謹慎中である以上は、再び無信号の状態となっていた。<br />
			<br />
			「……ふん。理想ばかり追うなとは、よくいったものだな。相棒もきっと そう思うだろうよ」<br />
			何かを察した39(サク)は、そう乾いた笑みを遺すように遅れてサーバルームを後にした。<br />
			<br /></p>
			<p><br />
			そして現在、93(クミ)の状況は少しずつではありながら改善していた。なんと、奇跡的に懲戒処分の期間よりも早くに93(クミ)の免罪と活動復帰が法的にも認可されたのだ。<br />
			決め手となったのは、93(クミ)の復帰に向け零が93(クミ)の活動記録を読み返していたところ、93(クミ)が暴走未遂に陥った原因として 取り押さえられた前日に当時の主従契約者による人為的な回路損傷によるデータの破損が確認されたことだった。口論になったのち突き飛ばされた反動で負ったものと思われたため、警察に器物損害（※人間でいう加害）として業務妨害に関する被害届け出をこの記録と共に提出したところ、取り調べを進めたのち あちら側の罪も認められたのだ。<br />
			<br />
			零「……とはいっても、当時の主人(クライアント)君にも満足できるようなマッチングを提供できなかったのは、私(あたし)にも責任があるのかもなぁ」<br />
			39「気に病むな、相手が悪かっただけの話だろ」<br />
			メンテナンス室で何かを待っている零と39(サク)は、これまでの始末沙汰を振り返りながら安心した様子で会話をしている。<br />
			百「（ｺﾝｺﾝ）……零、39(サク)。おまたせ。無事に調整が終わった、２ヶ月近い闘病を経てついに復帰した彼女を労ってやってくれ」<br />
			零「おっ、待ってたよ。どうぞ」<br />
			そう扉のノック音に応じると、表情や様子からかつての元気と意欲が戻ってきた１人のナンバーテールズが入室した。<br />
			39「……おかえり、93(クミ)」<br />
			93「うんっ、ただいま！」<br />
			窓の外の天気は久々の快晴だった。何度も九蓮国の天地を通りかかった雨雲と雨風は、予報だとしばらく見ることはないようだ。
			</p>

			クラスロット「コミュニティーズ」に属するトリプルフォーズ型量産ナンバーテールズ。<br />
			148番機シリーズの代表個体で、「ダンバー数」という生体社会における定量的傾向の実測値をモチーフにしたデザインがなされていることから、対人的統括に関する性能に秀でた<a class="a-p" href="/characters/character48.html">「48(シハチ)」</a>の設計思想を継ぐ個体でもある。<br />
			なお、本人は男性型であるが<a class="a-p" href="/characters/character14.html">「14(トヨ)」</a>や<a class="a-p" href="/characters/character58.html">「58(イソヤ)」</a>の影響を受け女装を好んでいる。
			<template #gender>男性</template>

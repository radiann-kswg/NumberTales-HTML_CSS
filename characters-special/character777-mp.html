<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="/stylesheet.css" />
	<link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13"></script>
	<script>
		window.Vue ||
			document.write(
				'<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"><\/script>'
			);
	</script>
	<title>数字の癒し？キャラ化計画「ナンバーテールズ」-「量産型777(ヨロコビ)」</title>
	<meta name="description" content="「ナンバーテールズ」は、ラジアン(柏木主税)によって数字たちからキャラクターデザインされた「数秘術系妖獣型ヒューマノイド」という設定のオリジナルキャラです。" />
</head>

<body>
	<header>
		<div id="app-menu">
			<hamberger-menu></hamberger-menu>
		</div>
		<script src="/src/hamberger-menu.js"></script>
	</header>
	<main id="app-character-page">
		<character-special-page-comp wide-style="true">
			<template #title>量産型777(ヨロコビ)</template>
			3桁ゾロ目の数字を持つ特殊クラスロットの「量産型マスタートリプル」に属し、通常個体と引け目を取らない性能をもつ通常個体互換の量産型ナンバーテールズ。<br />
			<a class="a-p" href="../characters/character7.html">「7(ナナ)」</a>や<a class="a-p" href="../characters/character77.html">「77(ナヅナ)」</a>の基本設計を踏襲し、加えて「VII×3.R(ラッキーセブンアール)」型アドオンによる機能特化に秀でたアーキテクチャを持つ。
			<template #gender>男性</template>
			<template #height>161cm</template>
			<template #weight>50kg(拡張ユニット3～6kgを除く)</template>
			<template #conceptage>32(概算)</template>
			<template #numberoftails>7x3</template>
			<template #orderlot>777-*****</template>
			<template #belongingclass>量産型マスタートリプル</template>
			<template #motif>3桁ゾロ目, スロットのラッキーセブン</template>
			<template #characterimage><img alt="画像が見つかりませんでした" src="/img/cnsp/cnsp_img777-orig.png" class="character-img" /></template>
		</character-special-page-comp>
	</main>
	<script src="/src/character-page.js"></script>
	<footer>
		<div id="app-credit">
			<footer-credit></footer-credit>
		</div>
		<script src="/src/credit-footer.js"></script>
	</footer>
</body>

</html>

<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="/stylesheet.css" />
	<link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13"></script>
	<script>
		window.Vue ||
			document.write(
				'<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"><\/script>'
			);
	</script>
	<title>数字の癒し？キャラ化計画「ナンバーテールズ」-「量産型444(シテン)」</title>
	<meta name="description" content="「ナンバーテールズ」は、ラジアン(柏木主税)によって数字たちからキャラクターデザインされた「数秘術系妖獣型ヒューマノイド」という設定のオリジナルキャラです。" />
</head>

<body>
	<header>
		<div id="app-menu">
			<hamberger-menu></hamberger-menu>
		</div>
		<script src="/src/hamberger-menu.js"></script>
	</header>
	<main id="app-character-page">
		<character-special-page-comp>
			<template #title>量産型444(シテン)</template>
			3桁ゾロ目の数字を持つ特殊クラスロットの「量産型マスタートリプル」に属し、通常個体と引け目を取らない性能をもつ通常個体互換の量産型ナンバーテールズ。<br />
			<a class="a-p" href="../characters/character4.html">「4(モチ)」</a>や<a class="a-p" href="../characters/character44.html">「44(シトシ)」</a>の基底設計を踏襲し、同クラスロットの中でも高い演算性能を持つ。
			<template #gender>中性</template>
			<template #height>163cm</template>
			<template #conceptage>44<span class="p-small">(便宜上)</span></template>
			<template #numberoftails>4x3</template>
			<template #orderlot>444-*****</template>
			<template #belongingclass>量産型マスタートリプル</template>
			<template #motif>3桁ゾロ目, 平方数(2乗数)の下3桁で000以外唯一のゾロ目</template>
			<template #characterimage><img alt="画像が見つかりませんでした" src="/img/cnsp-sp/cnsp_img444-mp.png" class="character-img" /></template>
		</character-special-page-comp>
	</main>
	<script src="/src/character-page.js"></script>
	<footer>
		<div id="app-credit">
			<footer-credit></footer-credit>
		</div>
		<script src="/src/credit-footer.js"></script>
	</footer>
</body>

</html>

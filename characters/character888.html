<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="/stylesheet.css" />
	<link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13"></script>
	<script>
		window.Vue ||
			document.write(
				'<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"><\/script>'
			);
	</script>
	<title>数字の癒し？キャラ化計画「ナンバーテールズ」-「888(ムゲン)」</title>

<body>
	<header>
		<div id="app-menu">
			<hamberger-menu></hamberger-menu>
		</div>
		<script src="/src/hamberger-menu.js"></script>
	</header>
	<main id="app-character-page">
		<character-page-comp wide-style="true">
			<template #title>888(ムゲン)</template>
			――他と違う？何を今更。尻尾はどうした？何を今更。<br />
			“妾(わたし)”は最終型ハイナンバーぞ、求める設計なら此処にある。<br />
			“無限の888番機”ぞ、足らぬもの等あらぬ。<br />
			「マスタートリプル」最後で崇高な設計である“妾(わたし)”の絶大な“加護(ちから)”を、今ここで試してみるか－－？
			<template #callingme>妾(わたし)</template>
			<template #callingyou>其方(あなた)</template>
			<template #gender>中性</template>
			<template #height>156cm</template>
			<template #conceptage>18</template>
			<template #numberoftails>翼＋尾羽</template>
			<template #belongingclass>マスタートリプル</template>

			<template #hobby>成し遂げること</template>
			<template #skill>宝探し</template>
			<template #favors>龍天国の開運術</template>
			<template #unlikes>不規則な文字列・パスワード</template>
			<template #characterimage><img alt="画像が見つかりませんでした" src="/img/cnsp/cnsp_img888-orig.png" class="character-img" /></template>
		</character-page-comp>
	</main>
	<script src="/src/character-page.js"></script>
	<footer>
		<div id="app-credit">
			<footer-credit></footer-credit>
		</div>
		<script src="/src/credit-footer.js"></script>
	</footer>
</body>

</html>

<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="/stylesheet.css" />
	<link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13"></script>
	<script>
		window.Vue ||
			document.write(
				'<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"><\/script>'
			);
	</script>
	<title>数字の癒し？キャラ化計画「ナンバーテールズ」-「80(ヤソ)」</title>
	<meta name="description" content="「ナンバーテールズ」は、ラジアン(柏木主税)によって数字たちからキャラクターデザインされた「数秘術系妖獣型ヒューマノイド」という設定のオリジナルキャラです。" />
</head>

<body>
	<header>
		<div id="app-menu">
			<hamberger-menu></hamberger-menu>
		</div>
		<script src="/src/hamberger-menu.js"></script>
	</header>
	<main id="app-character-page">
		<character-page-comp>
			<template #title>80(ヤソ)</template>
			仮想通貨や物流、さらには資産情報さえ主人のために投資…ではなくファンディングを常時気にして病まない、99人の自称営業課。<br />
			目まぐるしく変わる相場に対し強い注意意識があり、その形相は変人と思われるほどに敏感。<br />
			しかし一方で少額な出資から一発逆転かの如く高額な収入を恵むことがごく稀にあるとか……ないとか。
			<template #callingme>わたくしめ, おれ</template>
			<template #callingyou>ダンナ/奥サマ, (名前呼び)</template>
			<template #gender>女性</template>
			<template #height>144cm</template>
			<template #weight>推定45kg</template>
			<template #conceptage>27</template>
			<template #numberoftails>8</template>
			<template #belongingclass>10倍番(テンズデジッツ)</template>
			<template #potential>物流を体感できる</template>
			<template #characteristic>相場不安症で相場や価値の流れに敏感、現金主義かつギャンブラーな本性を持つ</template>
			<template #hobby>自動売買の運用</template>
			<template #skill>宝くじの当選番号予想</template>
			<template #favors>FX・仮想通貨</template>
			<template #unlikes>大暴落（景気の悪化,倒産,壊滅など）</template>
			<template #characterimage><img alt="画像が見つかりませんでした" src="/img/cnsp/cnsp_img80.png" class="character-img" /></template>
		</character-page-comp>
	</main>
	<script src="/src/character-page.js"></script>
	<footer>
		<div id="app-credit">
			<footer-credit></footer-credit>
		</div>
		<script src="/src/credit-footer.js"></script>
	</footer>
</body>

</html>

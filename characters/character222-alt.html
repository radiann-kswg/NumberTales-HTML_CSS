    <title>数字の癒し？キャラ化計画「ナンバーテールズ」-「222(ドッペル)」</title>
    <meta name="description" content="「ナンバーテールズ」は、ラジアン(柏木主税)によって数字たちからキャラクターデザインされた「数秘術系妖獣型ヒューマノイド」という設定のオリジナルキャラです。"/>

  <body>
    <header>
      <div id="app-menu">
        <hamberger-menu></hamberger-menu>
      </div>
      <script src="/src/hamberger-menu.js"></script>
    </header>
    <main id="app-character-page">
      <character-page-comp>
        <template #title>222(ドッペル)</template>
		量産販売型かつ3桁ゾロ目の数字を持つ「マスタートリプル」という高性能な特殊クラスの個体。<br />
		そのうち222番機の開発専用オリジナル機は２体存在し、その１体である彼女は<a class="a-p" href="character111.html">「111(アイズ)」</a>の後続型にあたる。<br />
		<a class="a-p" href="character2.html">「2(ツグ)」</a>・<a class="a-p" href="character2-alt.html">「バイナ」</a>や<a class="a-p" href="character22.html">「22(フジ)」</a>にも劣らず仲介や縁づくりが得意で、“クラスのマドンナ”のごとく周りに親しまれている。<br />
		222番機こと腹違いの双子として彼女と同式扱いとなっている<a class="a-p" href="character222.html">「222(ペルゲン)」</a>にもよく甘えており、義姉妹愛の溢れる様子も。
        <template #callingme>私(わたし)</template>
        <template #callingyou>兄樣(にいさま)/姉樣(ねえさま)</template>
        <template #gender>女性</template>
        <template #height>148cm(222番機の平均)</template>
        <template #weight>42kg(222番機の平均)</template>
        <template #conceptage>16</template>
        <template #numberoftails>2x3(3x2)</template>
        <template #belongingclass>マスタートリプル</template>
        <template #potential>疎外感を解消し縁を育む</template>
        <template #characteristic>人と一緒にいるのが好きでよく会話の輪に溶け込もうとする</template>
        <template #hobby>ボイスチャット（主に雑談）、友人と番組を同時視聴すること</template>
        <template #skill>喧嘩の仲裁</template>
        <template #favors>猫、コアフォルダ、親しい人とのスキンシップ</template>
        <template #unlikes>自分勝手や私利私欲、挟みな状況、頑なに（特定/不特定を問わず）他者を拒絶する人</template>
        <template #characterimage ><img alt="画像が見つかりませんでした" src="/img/cnsp/cnsp_img222-origB.png" class="character-img"/></template>
      </character-page-comp>
    </main>
    <script src="/src/character-page.js"></script>
    <footer>
      <div id="app-credit">
        <footer-credit></footer-credit>
      </div>

    </footer>

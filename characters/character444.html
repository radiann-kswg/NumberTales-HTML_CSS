<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="utf-8" />
	<link rel="stylesheet" href="/stylesheet.css" />
	<link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13"></script>
	<script>
		window.Vue ||
			document.write(
				'<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"><\/script>'
			);
	</script>
	<title>数字の癒し？キャラ化計画「ナンバーテールズ」-「444(シテン)」</title>
	<meta name="description" content="「ナンバーテールズ」は、ラジアン(柏木主税)によって数字たちからキャラクターデザインされた「数秘術系妖獣型ヒューマノイド」という設定のオリジナルキャラです。" />
</head>

<body>
	<header>
		<div id="app-menu">
			<hamberger-menu></hamberger-menu>
		</div>
		<script src="/src/hamberger-menu.js"></script>
	</header>
	<main id="app-character-page">
		<character-page-comp>
			<template #title>444(シテン)</template>
			量産販売型ではあるが、3桁ゾロ目の数字を持つ「マスタートリプル」という特殊クラスの個体で、2桁以内の通常個体と引け目を取らない性能をもつ。<br />
			とりわけその開発専用機ことオリジナル版である彼(女)は、<a class="a-p" href="character4.html">4(モチ)</a>や<a class="a-p" href="character44.html">44(シトシ)</a>をも凌駕する実現力の持ち主で、失敗経験のない威厳ある彼(女)の前ではどんな物事も叶えてしまうと極めて高いレヴューを受けている……“極めて不運かつ想定外の”ことが起きてしまった場合を除けば。
			<template #callingme>我輩</template>
			<template #callingyou>提督殿,提督</template>
			<template #gender>中性</template>
			<template #height>163cm</template>
			<template #conceptage>44<span class="p-small">(便宜上)</span></template>
			<template #numberoftails>4x3</template>
			<template #belongingclass>マスタートリプル, スクエアエリート</template>
			<template #potential>完璧な理論に則り物事を実現する</template>
			<template #characteristic>気高く構えた態度で敬意深い<span class="p-small">（ただし想定外のことが起きると自分のプライドを守りたいがために様子が不安定になることもある）</span></template>
			<template #hobby>論文を読むこと</template>
			<template #skill>数学（特に微分方程式などのような物理学的な代数学に強い）</span>
			</template>
			<template #favors>特異点<span class="p-small">（基礎理論によって証明できる特殊な状態）</span></template>
			<template #unlikes>理論に乗らないこと</template>
			<template #characterimage><img alt="画像が見つかりませんでした" src="/img/cnsp/cnsp_img444-orig.png" class="character-img" /></template>
		</character-page-comp>
	</main>
	<script src="/src/character-page.js"></script>
	<footer>
		<div id="app-credit">
			<footer-credit></footer-credit>
		</div>
		<script src="/src/credit-footer.js"></script>
	</footer>
</body>

</html>

<!DOCTYPE html>

    <title>数字の癒し？キャラ化計画「ナンバーテールズ」-「222(ペルゲン)」</title>
    <meta name="description" content="「ナンバーテールズ」は、ラジアン(柏木主税)によって数字たちからキャラクターデザインされた「数秘術系妖獣型ヒューマノイド」という設定のオリジナルキャラです。"/>
  </head>

  <body>
    <header>
      <div id="app-menu">
        <hamberger-menu></hamberger-menu>
      </div>
      <script src="/src/hamberger-menu.js"></script>
    </header>
    <main id="app-character-page">
      <character-page-comp>
        <template #title>222(ペルゲン)</template>
		量産販売型かつ3桁ゾロ目の数字を持つ「マスタートリプル」という高性能な特殊クラスの個体。<br />
		そのうち222番機の開発専用オリジナル機は２体存在し、その１体である彼女は<a class="a-p" href="character2-alt.html">「バイナ」</a>らの後続型にあたる。<br />
		<a class="a-p" href="character2.html">「2(ツグ)」</a>・「バイナ」や<a class="a-p" href="character22.html">「22(フジ)」</a>にも劣らず周囲状況に対する配慮に秀でており、“優しいお姉さん”のごとく周りに親しまれている。<br />
		222番機こと腹違いの双子として彼女と同式扱いとなっている<a class="a-p" href="character222-alt.html">「222(ドッペル)」</a>とよく生活を共にしており、義姉妹間の信頼の強さもみられている。
        <template #callingme>私(わたし)</template>
        <template #callingyou>兄樣(にいさま)/姉樣(ねえさま)</template>
        <template #gender>女性</template>
        <template #height>147cm</template>
        <template #weight>42kg</template>
        <template #conceptage>16</template>
        <template #numberoftails>2x3(3x2)</template>
        <template #belongingclass>マスタートリプル</template>
        <template #potential>疎外感を解消し縁を育む</template>
        <template #characteristic>ふんわりと落ち着いた優しい気質でよく周りのことをみている</template>
        <template #hobby>ボイスチャット（主に雑談）、民泊で友人と過ごすこと</template>
        <template #skill>寝具や居室回りの掃除、ベッドメイキング</template>
        <template #favors>猫、コアフォルダ、親しい人との会合</template>
        <template #unlikes>自分勝手や私利私欲、魔女狩り、美徳に反して他者を傷つける人</template>
        <template #characterimage ><img alt="画像が見つかりませんでした" src="/img/cnsp/cnsp_img222-origA.png" class="character-img"/></template>
      </character-page-comp>
    </main>
    <script src="/src/character-page.js"></script>
    <footer>
      <div id="app-credit">
        <footer-credit></footer-credit>
      </div>
      <script src="/src/credit-footer.js"></script>
    </footer>

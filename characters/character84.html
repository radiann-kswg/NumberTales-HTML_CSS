<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/stylesheet.css" />
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13"></script>
    <script>
      window.Vue ||
        document.write(
          '<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"><\/script>'
        );
    </script>
    <title>数字の癒し？キャラ化計画「ナンバーテールズ」-「84(ヤツヨ)」</title>
    <meta
      name="description"
      content="「ナンバーテールズ」は、ラジアン(柏木主税)によって数字たちからキャラクターデザインされた「数秘術系妖獣型ヒューマノイド」という設定のオリジナルキャラです。"
    />
  </head>

  <body>
    <header>
      <div id="app-menu">
        <hamberger-menu></hamberger-menu>
      </div>
      <script src="/src/hamberger-menu.js"></script>
    </header>
    <main id="app-character-page">
      <character-page-comp>
        <template #title>84(ヤツヨ)</template>
		マネタイズや実行計画などを得意分野とし、社会的な自己実現を望む主人層から定評と信頼を得ている。<br />
		プライベートでは貪欲に物事へ積極的な姿勢をみせる一面があるものの、根本的には若干 理屈っぽくどこか社会的思想の強い部分が否めていないと言われている。<br />
		果たして自分の行動意欲の源にあるものは、感情的な欲求なのか あるいは……
        <template #callingme>あたし,わたし</template>
        <template #callingyou>主様(あるじさま)</template>
        <template #gender>女性</template>
        <template #height>157cm</template>
        <template #conceptage>20</template>
        <template #numberoftails>8(8+4)</template>
        <template #belongingclass>デュアルスリーズ</template>
        <template #potential>計画した結果を出させる</template>
        <template #characteristic
          >欲望に従順だが計画性における理屈っぽさも併せ持つ</template
        >
        <template #hobby>貯金と大人買い</template>
        <template #skill>家計簿処理、主人の趣味のマネタイズ</template>
        <template #favors>等価交換・社会的信用というお金の考え方</template>
        <template #unlikes>窃盗・高額転売</template>
        <template #characterimage
          ><img
            alt="画像が見つかりませんでした"
            src="/img/cnsp/cnsp_img84.png"
            class="character-img"
        /></template>
      </character-page-comp>
    </main>
    <script src="/src/character-page.js"></script>
    <footer>
      <div id="app-credit">
        <footer-credit></footer-credit>
      </div>
      <script src="/src/credit-footer.js"></script>
    </footer>
  </body>
</html>

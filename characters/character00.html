	<header>
		<div id="app-menu">
			<hamberger-menu></hamberger-menu>

	<main id="app-character-page">
		<character-page-comp wide-style="true">
			<template #title>零百(カズナイハゲム)</template>
			ナンバーテールズのハードウェアにおける設計開発・修理を担当し、<a class="a-p" href="character0.html">零</a>とは双子の弟で同職種。<br />
			学部生の時にロボコンで世界トップ10のメカニックとして業績を残している。<br />
			理論的かつ冷静で、零の暴走を抑止する真面目な存在だが、自分の開発物に込めた熱意は譲らない。<br />
			趣味はスクラップ品の散策とリサイクル。稀に遠出する。
			<template #callingme>僕(ぼく)</template>
			<template #callingyou>クライアント君</template>
			<template #gender>男性</template>
			<template #height>165cm</template>
			<template #numberoftails>アクセサリー×1</template>
			<template #belongingclass>開発者, CTO(最高技術所長)</template><template #characteristic>理知的で冷静な性格、しかし技術や機械に対する熱意は譲れない</template>

			<template #skill>機械加工</template>
			<template #favors>最新技術</template>
			<template #unlikes>技術が人間により不当搾取されること全般</template>
			<template #characterimage><img alt="画像が見つかりませんでした" src="/img/cnsp/cnsp_img00.png" class="character-img"></template>

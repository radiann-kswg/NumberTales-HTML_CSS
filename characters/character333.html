	<title>「333(トリニティア)」 - 数字の癒し？キャラ化計画「ナンバーテールズ」</title>
    <meta name="description" content="「ナンバーテールズ」は、ラジアン(柏木主税)によって数字たちからキャラクターデザインされた「数秘術系妖獣型ヒューマノイド」という設定のオリジナルキャラです。"/>
  </head>

  <body>
    <header>
      <div id="app-menu">
        <hamberger-menu></hamberger-menu>
      </div>
      <script src="/src/hamberger-menu.js"></script>
    </header>
    <main id="app-character-page">
      <character-page-comp>
        <template #title>333(トリニティア)</template>
		量産販売型ではあるが、3桁ゾロ目の数字を持つ「マスタートリプル」という特殊クラスの個体で、とりわけその開発用333番機である彼女は<a class="a-p" href="character22.html">「22(フジ)」</a>や<a class="a-p" href="character3x11.html">「トレッド」</a>といった11号機型、および<a class="a-p" href="character111.html">「111(アイズ)」</a>や<a class="a-p" href="character222-alt.html">「222(ドッペル)」</a>や<a class="a-p" href="character222.html">「222(ペルゲン)」</a>といった111番機系列の設計を結集させた集大成とも言える個体である。<br />
		<a class="a-p" href="character3.html">「3(ナオ)」</a>や<a class="a-p" href="character33.html">「33(ミサ)」</a>をも遥かに上回る交友・交信能力の持ち主で、おっとりしている幼い見た目に反して人慣れした積極性はとても計り知れない…………たまに時計や音響機器にも話し掛けるほど饒舌な一面もあるが。
        <template #callingme>わたくし</template>
        <template #callingyou>お客さま</template>
        <template #gender>女性</template>
        <template #height>113cm</template>
        <template #weight>30kg</template>
        <template #conceptage>9</template>
        <template #numberoftails>3(3+3+3,1本に編み込まれている)</template>
		<template #belongingclass>マスタートリプル, テックシステマーズ, フェイタルテールズ, ワノマチ</template>
        <template #potential>万物と会話（交信・通信）できる</template>
        <template #characteristic>おっとりしていて人懐っこくかなり積極的</template>
        <template #hobby>レトロ機器・アンティーク機器の鑑賞（主に電信機材）</template>
        <template #skill>言語の壁を越えられる（喩え人間でなくても）</template>
        <template #favors>通信機器・電信機材、放送局周辺の喫茶店</template>
        <template #unlikes>ノイズ・音割れ・妨害電波、言葉は通じても話は通じない存在</template>
        <template #characterimage ><img alt="画像が見つかりませんでした" src="/img/cnsp/cnsp_img333-orig.png" class="character-img"/></template>
      </character-page-comp>
    </main>
    <script src="/src/character-page.js"></script>
    <footer>
      <div id="app-credit">
        <footer-credit></footer-credit>
      </div>
